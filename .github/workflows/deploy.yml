name: Deploy to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      CPANEL_PORT: ${{ secrets.CPANEL_PORT != '' && secrets.CPANEL_PORT || '2239' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$CPANEL_PORT" ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy site
        run: |
          tar czf site.tar.gz -C out .
          scp -P "$CPANEL_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            site.tar.gz \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:~/site.tar.gz
          ssh -p "$CPANEL_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "mkdir -p ~/maternitypaycalculator.co.uk && cd ~/maternitypaycalculator.co.uk && for i in 1 2 3 4 5; do find . -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} + 2>/dev/null && break || sleep 3; done && tar xzf ~/site.tar.gz && rm -f ~/site.tar.gz"
